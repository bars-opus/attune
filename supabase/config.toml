project_id = "mrgjtyacrzfylawyzabm"

[functions.create-relationship-invite]
verify_jwt = true

[functions.accept-invite]
verify_jwt = true

[functions.planning-link-preview]
verify_jwt = true

[functions.calendar-feed]
verify_jwt = false

# Spec 1 W2c: called by the app before sign-in; per-IP and per-number caps
# live in otp_record_intent.
[functions.otp-delivery-intent]
verify_jwt = false

# Spec 1 W2c: called by Supabase Auth (Send SMS Hook) with a Standard
# Webhooks signature (SEND_SMS_HOOK_SECRET), not a user JWT.
[functions.send-sms-hook]
verify_jwt = false

# Spec 1 W6a: called by the app with no session, after the access-token
# hook refused a code sign-in with account_dormant:<nonce>. Per-IP limit in
# consume_fresh_start.
[functions.start-fresh-account]
verify_jwt = false

# Spec 1 W6a: the Custom Access Token Hook (public.attune_access_token_hook)
# is switched on per project in the dashboard (owner deploy checklist), like
# the Send SMS Hook below, never from this file. To try it on a local stack:
# [auth.hook.custom_access_token]
# enabled = true
# uri = "pg-functions://postgres/public/attune_access_token_hook"

# Spec 1 W2c: the Send SMS Hook is switched on per project in the dashboard
# (owner deploy checklist), never from this file: enabled here, every
# `supabase start` (CI included) would need SEND_SMS_HOOK_SECRET set, and a
# `supabase config push` would carry it to the project. To try it on a local
# stack, uncomment and export the secret first:
# [auth.hook.send_sms]
# enabled = true
# uri = "http://host.docker.internal:54321/functions/v1/send-sms-hook"
# secrets = "env(SEND_SMS_HOOK_SECRET)"
